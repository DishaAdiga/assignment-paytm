databases:
  - name: wallet-db
    plan: free
    databaseName: wallet
    user: wallet

services:
  - type: web
    name: wallet-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString
